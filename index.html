<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Support Generator has moved</title>
</head>
<body>
  <h1>Support Generator has moved</h1>
  <p>The generator is now part of the internal Support Dashboard. Sign-in is required.</p>
  <p><a id="destination" href="https://support.sgdev.org/support-generator/">Open Support Generator</a></p>
  <noscript><p>JavaScript is needed to carry bookmarked command inputs to the new address automatically.</p></noscript>
  <script>
    const destination = 'https://support.sgdev.org/support-generator/' + location.search + location.hash;
    document.getElementById('destination').href = destination;
    location.replace(destination);
  </script>
</body>
</html>
